name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Dependency security audit
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            range: item.range,
            fixAvailable: item.fixAvailable,
            via: item.via.map((entry) => typeof entry === "string" ? entry : entry.title),
          }));
          console.log(JSON.stringify({
            summary: report.metadata?.vulnerabilities ?? "No audit summary returned",
            vulnerabilities,
          }, null, 2));
          NODE

      - name: Lint
        run: npm run lint

      - name: Type-check and build static site
        run: npm run build

      - name: Verify retained static pages
        run: |
          test -f out/resume/index.html
          test -f out/blogs/java-8-streams/index.html
          test -f out/profile.jpg
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload static export
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
